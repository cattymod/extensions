<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CattyMod • Scratch Auth</title>
<meta name="referrer" content="no-referrer">

<style>
:root{
    --bg:#0f1220;
    --card:#181c30;
    --card2:#212744;
    --accent:#8b7cff;
    --text:#ffffff;
    --muted:#b8bfd8;
    --success:#43d17a;
    --error:#ff5f6d;
}

*{box-sizing:border-box;}

body{
    margin:0;
    background:linear-gradient(135deg,#0f1220,#171b31);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:520px;
    background:var(--card);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:32px;
    box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.logo{
    width:74px;
    height:74px;
    margin:auto;
    background:linear-gradient(135deg,var(--accent),#1DB4FF);
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
}

h1{
    margin:18px 0 6px;
    text-align:center;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:26px;
}

.status{
    background:var(--card2);
    border-radius:16px;
    padding:18px;
    text-align:center;
    font-weight:600;
}

.success{
    background:rgba(67,209,122,.14);
    color:var(--success);
}

.error{
    background:rgba(255,95,109,.14);
    color:var(--error);
}

.info{
    background:rgba(139,124,255,.14);
    color:#d9d3ff;
}

.details{
    margin-top:18px;
    background:rgba(255,255,255,.03);
    border-radius:14px;
    padding:16px;
    display:none;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
}

.row span:first-child{
    color:var(--muted);
}

footer{
    margin-top:22px;
    text-align:center;
    color:#7d85a6;
    font-size:13px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo"><img src="https://cattymod.app/assets/cattymod.png" alt="" width="40"></div>

    <h1>CattyMod</h1>
    <div class="subtitle">Scratch Auth Callback</div>

    <div id="status" class="status info">
        Verifying your Scratch account…
    </div>

    <div id="details" class="details">
        <div class="row">
            <span>Username</span>
            <strong id="username">—</strong>
        </div>
        <div class="row">
            <span>State</span>
            <strong id="stateText">Verified</strong>
        </div>
    </div>

    <footer>
        This window should close automatically.
    </footer>

</div>

<script>
const EXPECTED_ORIGIN = "https://cattymod.app";
const EXPECTED_REDIRECT = "https://cattymod.app/extensions/scratchAuth/callback.html";
const VERIFY_URL = "https://auth.itinerary.eu.org/api/auth/verifyToken";

const statusBox = document.getElementById("status");
const detailsBox = document.getElementById("details");
const usernameLabel = document.getElementById("username");

const params = new URLSearchParams(location.search);

const privateCode = params.get("privateCode");
const state = params.get("state");

function setStatus(text,type){
    statusBox.textContent=text;
    statusBox.className="status "+type;
}

(async()=>{
    if(!window.opener){
        setStatus("No CattyMod window found.","error");
        return;
    }

    if(!privateCode){
        setStatus("Missing Scratch Auth privateCode.","error");
        return;
    }

    if(!state){
        setStatus("Missing state parameter.","error");
        return;
    }

    try{

        const url=new URL(VERIFY_URL);
        url.searchParams.set("privateCode",privateCode);

        const res=await fetch(url,{
            cache:"no-store",
            credentials:"omit"
        });

        if(!res.ok){
            throw new Error("Verification failed.");
        }

        const data=await res.json();

        if(!data.valid){
            throw new Error("Authentication was rejected.");
        }

        if(data.redirect!==EXPECTED_REDIRECT){
            throw new Error("Redirect URL mismatch.");
        }

        usernameLabel.textContent=data.username;
        detailsBox.style.display="block";

        const token =
            data.oneClickSignInToken ||
            data.instantPrivateCode ||
            privateCode;

        window.opener.postMessage({
            type:"CATTYMOD_SCRATCH_AUTH_RESULT",
            username:data.username,
            token,
            state
        },EXPECTED_ORIGIN);

        setStatus("Authentication successful! Returning to CattyMod…","success");

        setTimeout(()=>{
            window.close();
        },1500);

    }catch(err){
        console.error(err);
        setStatus(err.message || "Authentication failed.","error");
    }

})();
</script>

</body>
</html>
